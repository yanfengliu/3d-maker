<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iPhone 17 Pro — three.js viewer</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0c10;
      }

      #stage {
        display: block;
        width: 100vw;
        height: 100vh;
        outline: none;
        touch-action: none;
      }

      #ui {
        position: fixed;
        top: 22px;
        left: 22px;
        z-index: 10;
      }

      /* In shot mode the overlay must land at its final position on the very
         first presented frame, so every entrance/transition is suppressed. */
      .shot #ui {
        animation: none !important;
        transition: none !important;
      }

      @media (prefers-reduced-motion: no-preference) {
        #ui {
          animation: ui-in 520ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
        }
      }

      @keyframes ui-in {
        from {
          opacity: 0;
          transform: translate3d(0, -10px, 0);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/iphone/main.ts"></script>
  </body>
</html>
